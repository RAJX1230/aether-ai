<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner - AETHER AI</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#faf9f7">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { height: 100%; background: #faf9f7; overflow-y: auto; }
  .p-screen { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: 40px; }

  .p-header {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    background: #fff; border-bottom: 1px solid #f0eee9; position: sticky; top: 0; z-index: 5;
  }
  .p-header h1 { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .back-btn { background: transparent; border: none; color: #1a1a1a; cursor: pointer; display: flex; }

  .p-body { padding: 16px; }

  .p-card { background: #fff; border: 1px solid #e5e2dd; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .p-card label { display: block; font-size: 12px; color: #8a8478; margin-bottom: 6px; font-weight: 600; }
  .p-card input, .p-card textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #e0dcd3;
    background: #faf9f7; color: #1a1a1a; font-size: 14px; outline: none; margin-bottom: 12px; font-family: inherit;
  }
  .p-card textarea { min-height: 90px; resize: vertical; }

  .gen-btn {
    width: 100%; padding: 13px; border-radius: 24px; border: none;
    background: #1a1a1a; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }

  .progress-wrap { margin-bottom: 16px; }
  .progress-bar-bg { height: 8px; background: #f0eee9; border-radius: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #c9553d; width: 0%; transition: width 0.3s ease; }
  .progress-label { font-size: 12px; color: #8a8478; margin-top: 6px; text-align: right; }

  .day-card { background: #fff; border: 1px solid #e5e2dd; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .day-title { padding: 12px 16px; background: #f4f3ee; font-size: 14px; font-weight: 700; color: #1a1a1a; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-top: 1px solid #f0eee9; font-size: 13.5px; color: #4a453d; }
  .task-row.done { color: #b5aea1; text-decoration: line-through; }
  .task-row input[type="checkbox"] { margin-top: 2px; accent-color: #c9553d; width: 16px; height: 16px; flex-shrink: 0; }

  .loading-msg { text-align: center; color: #8a8478; padding: 30px; font-size: 14px; }
  .clear-plan-btn {
    width: 100%; padding: 12px; margin-top: 8px; border-radius: 20px; border: 1px solid #c9553d;
    background: transparent; color: #c9553d; font-size: 13px; cursor: pointer;
  }
@view-transition { navigation: auto; }
</style>
</head>
<body>

  <div class="p-screen">
    <div class="p-header">
      <button class="back-btn" onclick="window.location.href='index.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1>Study Planner</h1>
    </div>

    <div class="p-body" id="pBody">
      <div class="p-card" id="inputCard">
        <label>Exam / Goal ka naam</label>
        <input type="text" id="examName" placeholder="Jaise: Class 10 Science Exam">

        <label>Kitne din mein exam hai?</label>
        <input type="number" id="numDays" placeholder="Jaise: 7" min="1" max="30">

        <label>Topics / Syllabus (jo padhna hai)</label>
        <textarea id="syllabusText" placeholder="Jaise: Acids Bases Salts, Light chapter, Chemical Reactions..."></textarea>

        <button class="gen-btn" id="generateBtn">Plan Banao</button>
      </div>

      <div id="planOutput"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="planner.js"></script>
</body>
</html>
