<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER AI - Login</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#faf9f7">
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">
      <img src="logo.svg" alt="AETHER" class="auth-logo">
      <h2 id="authTitle">AETHER AI Login</h2>

      <input type="email" id="emailInput" placeholder="Email">

      <div class="password-field">
        <input type="password" id="passwordInput" placeholder="Password">
        <button type="button" id="togglePassword">Show</button>
      </div>

      <button id="authActionBtn">Login</button>

      <div class="google-divider"><span>ya</span></div>

      <button id="googleLoginBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.3 6.6v5.5h7C42.5 36.5 45.1 31 45.1 24.5z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.1h-7.2v5.7C8.2 41 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.4C3 16.9 2.3 20.3 2.3 24s.7 7.1 2.1 9.9l7.2-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.2-6.2C34.9 4.3 29.9 2 24 2 15.5 2 8.2 7 4.4 14.1l7.2 5.7c1.7-5.2 6.6-9.1 12.4-9.1z"/></svg>
        Continue with Google
      </button>

      <p class="auth-toggle" id="forgotPasswordText">
        <span id="forgotLink">Password bhool gaye?</span>
      </p>

      <p class="auth-toggle" id="authToggleText">
        Naya account nahi hai? <span id="toggleLink">Signup karein</span>
      </p>

      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
