<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture Notes - AETHER AI</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#faf9f7">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { height: 100%; background: #faf9f7; overflow: hidden; }
  .lec-screen {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
  }
  .lec-header {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    background: #fff; border-bottom: 1px solid #f0eee9;
  }
  .lec-header h1 { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .back-btn { background: transparent; border: none; color: #1a1a1a; cursor: pointer; display: flex; }

  .rec-status {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px; font-size: 13px; color: #8a8478;
  }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; }
  .rec-dot.live { background: #c9553d; animation: blinkDot 1s infinite; }
  @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .transcript-box {
    flex: 1; overflow-y: auto; padding: 16px; font-size: 14px;
    color: #4a453d; line-height: 1.6; background: #fff; margin: 0 16px;
    border: 1px solid #e5e2dd; border-radius: 12px;
  }
  .transcript-box.empty { color: #b5aea1; display: flex; align-items: center; justify-content: center; text-align: center; }

  .lec-controls {
    display: flex; gap: 10px; padding: 16px;
  }
  .lec-btn {
    flex: 1; padding: 13px; border-radius: 24px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .rec-btn { background: #1a1a1a; color: #fff; }
  .rec-btn.recording { background: #c9553d; }
  .notes-btn { background: #f4f3ee; color: #1a1a1a; border: 1px solid #e5e2dd; }

  .notes-output {
    display: none; padding: 16px; background: #fff; margin: 0 16px 16px;
    border: 1px solid #e5e2dd; border-radius: 12px; font-size: 14px; color: #1a1a1a;
    line-height: 1.6; max-height: 40vh; overflow-y: auto;
  }
  .notes-output.show { display: block; }
  .notes-output strong { color: #c9553d; }
@view-transition { navigation: auto; }
</style>
</head>
<body>

  <div class="lec-screen">
    <div class="lec-header">
      <button class="back-btn" onclick="window.location.href='index.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1>Lecture Notes</h1>
    </div>

    <div class="rec-status">
      <div class="rec-dot" id="recDot"></div>
      <span id="recStatusText">Not recording</span>
    </div>

    <div class="transcript-box empty" id="transcriptBox">Class shuru hote hi "Start Recording" dabao — AETHER sunta rahega background mein.</div>

    <div class="notes-output" id="notesOutput"></div>

    <div class="lec-controls">
      <button class="lec-btn rec-btn" id="recBtn">Start Recording</button>
      <button class="lec-btn notes-btn" id="notesBtn">Generate Notes</button>
    </div>
  </div>

  <script src="lecture.js"></script>
</body>
</html>
